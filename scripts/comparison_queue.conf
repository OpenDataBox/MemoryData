[program:locomo-comparison-queue]
command=/venv/main/bin/python -u /workspace/MemoryData/scripts/locomo_server_queue.py --plan /workspace/MemoryData/comparison_config/plan.json
directory=/workspace/MemoryData
environment=HF_HOME="/workspace/.hf_home",OMP_NUM_THREADS="2",TOKENIZERS_PARALLELISM="false"
autostart=false
autorestart=false
redirect_stderr=true
stdout_logfile=/workspace/MemoryData/comparison_queue.log
stdout_logfile_maxbytes=50000000
stdout_logfile_backups=1
stopasgroup=true
killasgroup=true
stopwaitsecs=60
