[program:locomo-prefetch]
command=/bin/bash -c "uv venv --python /usr/bin/python3.12 /workspace/locomo-refinement/.prefetch && uv pip install --python /workspace/locomo-refinement/.prefetch/bin/python huggingface_hub==0.34.4 && /workspace/locomo-refinement/.prefetch/bin/python /workspace/locomo-refinement/prefetch.py"
environment=HF_HOME="/workspace/.hf_home",HF_HUB_DISABLE_XET="1",UV_CACHE_DIR="/workspace/locomo-refinement/uv_cache",PYTHONUNBUFFERED="1"
directory=/workspace/locomo-refinement
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/locomo-refinement/prefetch.log
stdout_logfile_maxbytes=0
redirect_stderr=true
