agent_name: Agentic_memory_retentionmem
model: Qwen3-8B
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./results/outputs/Qwen3-8B-retentionmem
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url: http://127.0.0.1:9909/v1
tokenizer_encoding: cl100k_base
retentionmem:
  mode: learned_residual
  policy_checkpoint: results/retentionmem/policies/policy_seed0.npz
  tokenizer_encoding: cl100k_base
  compressor: structured
  region_size: 8
  buffer_size: 8
  compression_ratio: 4
  max_probes: 8
  max_source_tokens: 24000
  query_budget: 4096
  llm:
    base_url: http://127.0.0.1:9909/v1
    model: Qwen3-8B
    disable_thinking: true
  embedding:
    base_url: http://127.0.0.1:9009/v1
    model: Qwen3-Embedding-4B
  judge:
    base_url: http://127.0.0.1:9910/v1
    model: Qwen2.5-7B-Instruct
