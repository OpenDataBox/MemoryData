[project]
name = "memory-agent"
version = "0.1.0"
description = "MemoryAgent — Proactive Memory Agent for Terminal-Bench (inference)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.12.5",
    "shortuuid>=1.0.13",
    "typer>=0.23.0",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "tenacity>=9.1.4",
    "python-dotenv>=1.2.1",
    "litellm>=1.81.11",
    "jinja2>=3.1.6",
    "pandas>=2.3.3",
    "pyarrow>=17.0.0",
    "toml>=0.10.2",
    "omegaconf>=2.3.0",
]

[project.scripts]
memory-agent = "memory_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
